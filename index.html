<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Proyek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0b1220;
    --navy-900:#101a2e;
    --navy-800:#16233d;
    --navy-700:#1e2f4f;
    --steel-400:#8b9ab3;
    --steel-200:#c9d2e0;
    --paper:#f5f6f8;
    --amber:#e2a233;
    --amber-dim:#4a3a1d;
    --green:#3fae6a;
    --green-dim:#1c3527;
    --red:#e2593a;
    --red-dim:#4a2318;
    --line:#26324a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--navy-950);}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:264px;flex-shrink:0;background:var(--navy-950);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:24px 24px;
    background-color:var(--navy-950);
    position:relative;color:var(--steel-200);
    display:flex;flex-direction:column;
  }
  .sidebar::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(11,18,32,0.2), var(--navy-950) 60%);
  }
  .sidebar-inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;}
  .brand{padding:28px 24px 20px;border-bottom:1px solid var(--line);}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  .brand-title{font-size:19px;font-weight:800;color:#fff;margin-top:4px;letter-spacing:-.01em;}
  .brand-sub{font-size:12px;color:var(--steel-400);margin-top:2px;}

  nav{padding:16px 12px;flex:1;overflow-y:auto;}
  .nav-group-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel-400);padding:10px 12px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:11px 12px;border-radius:8px;border:none;background:transparent;
    color:var(--steel-200);font-size:13.5px;font-weight:500;cursor:pointer;
    font-family:'Inter',sans-serif;margin-bottom:2px;transition:background .15s;
  }
  .nav-item .idx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel-400);width:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--navy-800);color:#fff;}
  .nav-item.active{background:var(--navy-700);color:#fff;box-shadow:inset 3px 0 0 var(--amber);}
  .nav-item.active .idx{color:var(--amber);}

  .sidebar-foot{padding:14px 24px;border-top:1px solid var(--line);font-size:11px;color:var(--steel-400);font-family:'IBM Plex Mono',monospace;}

  /* Main */
  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  header.topbar{
    background:#fff;border-bottom:1px solid #e2e5ea;padding:22px 36px;
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .page-title{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .page-desc{font-size:13px;color:#6b7484;margin-top:3px;}
  .refresh-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.04em;
    border:1px solid #d7dbe3;background:#fff;color:var(--navy-900);
    padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;
    display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .refresh-btn:hover{border-color:var(--navy-700);background:var(--paper);}
  .refresh-btn.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .content{padding:28px 36px 48px;flex:1;}

  /* Summary cards */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px;}
  .kpi-card{
    background:#fff;border:1px solid #e2e5ea;border-radius:var(--radius);padding:18px 20px;
    position:relative;overflow:hidden;
  }
  .kpi-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-color,var(--navy-700));}
  .kpi-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8992a3;}
  .kpi-value{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.02em;}
  .kpi-note{font-size:12px;color:#8992a3;margin-top:4px;}

  .summary-list{background:#fff;border:1px solid #e2e5ea;border-radius:var(--radius);overflow:hidden;}
  .summary-list-head{padding:14px 20px;border-bottom:1px solid #eef0f4;font-weight:700;font-size:13.5px;}
  .summary-row{
    display:flex;align-items:center;justify-content:space-between;padding:13px 20px;
    border-bottom:1px solid #f2f3f6;font-size:13.5px;cursor:pointer;transition:background .12s;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row:hover{background:var(--paper);}
  .summary-row-name{font-weight:600;}
  .summary-row-meta{display:flex;align-items:center;gap:10px;color:#8992a3;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.ok{background:var(--green);} .dot.warn{background:var(--amber);} .dot.bad{background:var(--red);} .dot.na{background:#c7cdd9;}

  /* Table */
  .table-wrap{background:#fff;border:1px solid #e2e5ea;border-radius:var(--radius);overflow:hidden;}
  .table-scroll{overflow:auto;max-width:100%;}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
  thead th{
    position:sticky;top:0;background:var(--navy-950);color:#fff;text-align:left;
    padding:11px 16px;font-weight:600;font-size:11.5px;letter-spacing:.03em;
    text-transform:uppercase;font-family:'IBM Plex Mono',monospace;z-index:2;
  }
  tbody td{padding:10px 16px;border-bottom:1px solid #f0f1f4;color:#2a3040;}
  tbody tr:hover{background:#f8f9fb;}
  tbody tr:nth-child(even){background:#fbfbfc;}
  tbody tr:nth-child(even):hover{background:#f4f5f8;}

  .status-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:3px 10px 3px 8px;border-radius:999px;font-family:'IBM Plex Mono',monospace;
  }
  .status-pill.ok{background:var(--green-dim);color:#7fe3a8;}
  .status-pill.warn{background:var(--amber-dim);color:#f2c266;}
  .status-pill.bad{background:var(--red-dim);color:#f29584;}
  .status-pill.na{background:#eceff3;color:#7a8195;}

  .state-box{padding:60px 20px;text-align:center;color:#8992a3;}
  .state-box.error{color:var(--red);}
  .state-box .mono{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:8px;color:#8992a3;}
  .spinner{width:26px;height:26px;border:3px solid #e2e5ea;border-top-color:var(--navy-700);border-radius:50%;margin:0 auto 14px;animation:spin .7s linear infinite;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d7dbe3;
    border-radius:8px;padding:8px 12px;font-size:13px;min-width:220px;
  }
  .search-box input{border:none;outline:none;font-size:13px;font-family:'Inter',sans-serif;width:100%;background:transparent;}
  .row-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8992a3;}

  /* Document-style sheet (LLE, dsb) */
  .doc-sheet{background:#fff;border:1px solid #d7dbe3;border-radius:var(--radius);overflow:hidden;}
  .doc-header{display:flex;align-items:center;gap:20px;padding:22px 28px;border-bottom:2px solid var(--navy-950);flex-wrap:wrap;}
  .doc-logo{height:46px;width:auto;flex-shrink:0;object-fit:contain;}
  .doc-logo-placeholder{
    height:46px;width:46px;flex-shrink:0;border:1px dashed #c7cdd9;border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:9px;color:#a7aebc;
    font-family:'IBM Plex Mono',monospace;text-align:center;line-height:1.2;
  }
  .doc-company{font-size:15px;font-weight:800;letter-spacing:.01em;margin-bottom:6px;}
  .doc-meta{display:grid;grid-template-columns:auto auto 1fr;column-gap:10px;row-gap:2px;font-size:12.5px;}
  .doc-meta-label{font-weight:700;color:var(--navy-950);}
  .doc-meta-colon{color:#8992a3;}
  .doc-meta-value{color:#2a3040;}

  .doc-table-scroll{overflow:auto;}
  table.doc-table{border-collapse:collapse;width:100%;font-size:12px;white-space:normal;}
  table.doc-table th{
    position:sticky;top:0;background:var(--navy-950);color:#fff;text-align:center;vertical-align:middle;
    padding:9px 10px;font-weight:600;font-size:11px;letter-spacing:.01em;
    font-family:'Inter',sans-serif;border:1px solid #2a3854;z-index:2;
  }
  table.doc-table td{padding:8px 10px;border:1px solid #dfe2e8;color:#2a3040;text-align:left;vertical-align:middle;}
  table.doc-table td.center{text-align:center;}
  table.doc-table tbody tr.doc-group-row td{
    background:#eef0f4;font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.02em;
  }
  table.doc-table tbody tr.doc-hold-row td{background:#f5a742;font-weight:600;}
  table.doc-table tbody tr:hover:not(.doc-group-row):not(.doc-hold-row) td{background:#f8f9fb;}

  .doc-footer{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:32px 28px 28px;border-top:1px solid #eef0f4;}
  .doc-sig{text-align:center;font-size:12.5px;}
  .doc-sig-label{text-decoration:underline;margin-bottom:44px;}
  .doc-sig-name{font-weight:700;text-decoration:underline;}
  .doc-sig-role{color:#6b7484;margin-top:2px;}

  .offline-banner{
    display:flex;align-items:center;gap:10px;background:#fdf3e3;border:1px solid #f0ddb2;
    color:#8a6116;font-size:12.5px;padding:10px 16px;border-radius:8px;margin-bottom:14px;
  }
  .add-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.04em;
    border:1px solid var(--navy-950);background:var(--navy-950);color:#fff;
    padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;
    display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .add-btn:hover{background:var(--navy-700);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,18,32,.5);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:20px;
  }
  .modal-box{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:86vh;
    display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{padding:18px 24px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-size:16px;font-weight:800;}
  .modal-close{border:none;background:transparent;cursor:pointer;color:#8992a3;font-size:18px;line-height:1;}
  .modal-body{padding:20px 24px;overflow-y:auto;display:grid;gap:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#4a5468;margin-bottom:5px;}
  .field input{
    width:100%;border:1px solid #d7dbe3;border-radius:8px;padding:9px 12px;font-size:13.5px;
    font-family:'Inter',sans-serif;outline:none;
  }
  .field input:focus{border-color:var(--navy-700);}
  .modal-foot{padding:16px 24px;border-top:1px solid #eef0f4;display:flex;justify-content:flex-end;gap:10px;}
  .btn-secondary{border:1px solid #d7dbe3;background:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
  .btn-primary{border:none;background:var(--navy-950);color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .modal-error{font-size:12.5px;color:var(--red);padding:0 24px 4px;}

  /* Revision-style drawing register table (Tender/Forcon Drawing) */
  .rev-sheet{background:#fff;border:1px solid #d7dbe3;border-radius:var(--radius);overflow:hidden;}
  .rev-header{padding:16px 22px;border-bottom:2px solid var(--navy-950);}
  .rev-title{font-size:13.5px;font-weight:800;color:var(--navy-950);text-transform:uppercase;letter-spacing:.01em;line-height:1.4;}
  .rev-subtitle{font-size:12.5px;font-weight:700;color:#4a5468;text-transform:uppercase;margin-top:2px;}

  .rev-table-scroll{overflow:auto;}
  table.rev-table{border-collapse:collapse;width:100%;font-size:12px;}
  table.rev-table th{
    background:#fff;color:var(--navy-950);text-align:center;vertical-align:middle;
    padding:8px 10px;font-weight:700;font-size:11px;border:1px solid #1a2436;
    font-family:'Inter',sans-serif;
  }
  table.rev-table th.group-th{background:#eef0f4;text-transform:uppercase;letter-spacing:.03em;}
  table.rev-table td{padding:8px 10px;border:1px solid #dfe2e8;color:#2a3040;text-align:left;vertical-align:middle;}
  table.rev-table td.center{text-align:center;}
  table.rev-table td.no-col{text-align:center;color:#4a5468;}
  table.rev-table td.rev-date{text-align:center;color:#2a3040;font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  table.rev-table tbody tr:nth-child(even){background:#fafbfc;}
  table.rev-table tbody tr:hover{background:#f4f6fa;}

  /* Shop Drawing form (kop + tabel 3 tingkat) */
  .sd-sheet{background:#fff;border:1px solid #d7dbe3;border-radius:var(--radius);overflow:hidden;}
  .sd-header{border-bottom:2px solid #0b1220;padding:16px 20px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  .sd-logos{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sd-logo{height:38px;width:auto;object-fit:contain;}
  .sd-logo-placeholder{
    height:38px;padding:0 10px;border:1px dashed #c7cdd9;border-radius:6px;display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#a7aebc;
    font-family:'IBM Plex Mono',monospace;
  }
  .sd-tagline{font-size:11px;color:#6b7484;margin-left:2px;}
  .sd-notes{margin-top:10px;font-size:11.5px;color:#2a3040;line-height:1.6;}
  .sd-notes b{font-weight:700;}
  .sd-right{font-size:11.5px;}
  .sd-lembar{text-align:right;font-weight:700;color:var(--navy-950);margin-bottom:8px;}
  .sd-nama-row{display:flex;gap:6px;}
  .sd-nama-row .code{font-weight:700;width:36px;flex-shrink:0;}
  .sd-status-title{font-weight:700;color:#1f4fb0;margin-top:10px;margin-bottom:2px;}
  .sd-status-row{display:flex;gap:8px;}
  .sd-status-row .code{font-weight:700;width:16px;flex-shrink:0;color:#1f4fb0;}

  .sd-table-scroll{overflow:auto;}
  table.sd-table{border-collapse:collapse;width:100%;font-size:11.5px;}
  table.sd-table th{
    background:#c3d4ef;color:#12224a;text-align:center;vertical-align:middle;
    padding:6px 8px;font-weight:700;font-size:10.5px;border:1px solid #6f88b8;
    font-family:'Inter',sans-serif;
  }
  table.sd-table th.italic{font-style:italic;font-weight:600;}
  table.sd-table td{padding:6px 8px;border:1px solid #d7dee9;color:#2a3040;text-align:center;vertical-align:middle;}
  table.sd-table td.left{text-align:left;}
  table.sd-table tbody tr.sd-group-row td{background:#dbe6f7;font-weight:700;text-align:left;text-transform:uppercase;font-size:11px;}
  table.sd-table tbody tr:nth-child(even):not(.sd-group-row){background:#f7f9fc;}
  table.sd-table tbody tr:hover:not(.sd-group-row){background:#eef3fb;}

  @media (max-width:820px){
    .sd-header{grid-template-columns:1fr;}
    .sd-lembar{text-align:left;}
  }

  /* Material Approval Submittal (Tabel A + Tabel B) */
  .ma-sheet{background:#fff;border:1px solid #d7dbe3;border-radius:var(--radius);overflow:hidden;}
  .ma-header{border-bottom:2px solid #0b1220;padding:16px 20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .ma-title{font-size:15px;font-weight:800;color:var(--navy-950);}
  .ma-sub{font-size:12px;color:#6b7484;margin-top:2px;}
  .ma-info{font-size:12px;text-align:right;line-height:1.6;}
  .ma-info b{color:var(--navy-950);}

  .ma-summary-wrap{padding:16px 20px 4px;}
  .ma-summary-title{font-size:12.5px;font-weight:800;color:var(--navy-950);text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px;}
  table.ma-summary{border-collapse:collapse;width:100%;font-size:11.5px;margin-bottom:16px;}
  table.ma-summary th{background:#16233d;color:#fff;padding:7px 8px;border:1px solid #1a2436;font-weight:700;text-align:center;}
  table.ma-summary td{padding:6px 8px;border:1px solid #dfe2e8;text-align:center;color:#2a3040;}
  table.ma-summary td.label{text-align:left;font-weight:600;background:#f7f8fa;}

  .ma-table-scroll{overflow:auto;}
  table.ma-table{border-collapse:collapse;width:100%;font-size:11.5px;}
  table.ma-table th{
    background:#16233d;color:#fff;text-align:center;vertical-align:middle;
    padding:6px 8px;font-weight:700;font-size:10.5px;border:1px solid #1a2436;
    font-family:'Inter',sans-serif;
  }
  table.ma-table th.italic{font-style:italic;font-weight:600;}
  table.ma-table td{padding:6px 8px;border:1px solid #dfe2e8;color:#2a3040;text-align:center;vertical-align:middle;}
  table.ma-table td.left{text-align:left;}
  table.ma-table tbody tr.ma-group-row td{background:#dbe6f7;font-weight:700;text-align:left;text-transform:uppercase;font-size:11px;}
  table.ma-table tbody tr:nth-child(even):not(.ma-group-row){background:#f7f9fc;}
  table.ma-table tbody tr:hover:not(.ma-group-row){background:#eef3fb;}
  table.ma-table td.ma-check{color:var(--green);font-weight:800;}

  .ma-legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 20px 18px;font-size:11.5px;color:#4a5468;}
  .ma-legend span b{color:var(--navy-950);margin-right:4px;}
  .ma-legend.stacked{flex-direction:column;gap:4px;}
  .ma-notes{padding:0 20px 18px;font-size:11.5px;color:#2a3040;line-height:1.7;}
  tr.ma-highlight-row td{background:#d9d9d9 !important;}

  .rfi-sign{display:flex;justify-content:flex-end;gap:60px;padding:24px 20px 26px;flex-wrap:wrap;}
  .rfi-sign-block{text-align:center;font-size:12.5px;color:#2a3040;}
  .rfi-sign-space{height:56px;}
  .rfi-sign-role{font-weight:700;border-top:1px solid #2a3040;padding-top:4px;min-width:160px;}

  /* Summary Monitoring Engineering */
  .smy-page-head{margin-bottom:18px;}
  .smy-page-title{font-size:16px;font-weight:800;color:var(--navy-950);letter-spacing:.01em;}
  .smy-page-updated{font-size:12px;color:#8992a3;font-family:'IBM Plex Mono',monospace;margin-top:2px;}

  .smy-section{background:#fff;border:1px solid #e2e5ea;border-radius:var(--radius);overflow:hidden;margin-bottom:24px;}
  .smy-section-title{background:var(--navy-950);color:#fff;padding:11px 18px;font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;}
  .smy-table-scroll{overflow:auto;padding:16px 18px 4px;}
  table.smy-table{border-collapse:collapse;width:100%;font-size:11.5px;white-space:nowrap;}
  table.smy-table th{background:#16233d;color:#fff;padding:7px 8px;border:1px solid #1a2436;font-weight:700;text-align:center;}
  table.smy-table td{padding:6px 8px;border:1px solid #dfe2e8;text-align:center;color:#2a3040;}
  table.smy-table td.label{text-align:left;font-weight:700;background:#f7f8fa;}
  table.smy-table td.pct-cell{color:#6b7484;font-size:10.5px;}
  tr.smy-row-a td{background:#e2efda;}
  tr.smy-row-a td.label{background:#d3e6c8;}
  tr.smy-row-b td{background:#c6e0b4;}
  tr.smy-row-b td.label{background:#b7d7a1;}
  tr.smy-row-c td{background:#fce4d6;}
  tr.smy-row-c td.label{background:#fad5c0;}
  tr.smy-row-resubmit td{background:#fff2cc;}
  tr.smy-row-resubmit td.label{background:#ffecb3;}

  .summary-charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:16px 18px 20px;}
  .chart-card{background:#fbfbfc;border:1px solid #eef0f4;border-radius:8px;padding:16px 18px;}
  .chart-card-title{font-size:11px;font-weight:800;color:var(--navy-950);margin-bottom:12px;text-transform:uppercase;letter-spacing:.03em;}

  return [...BUILTIN_PROJECTS, ...loadCustomProjects()];
}

function classifyStatus(text){
  if (!text) return "na";
  const t = String(text).toLowerCase();
  for (const s of STATUS_WORDS.bad)  if (t.includes(s)) return "bad";
  for (const s of STATUS_WORDS.ok)   if (t.includes(s)) return "ok";
  for (const s of STATUS_WORDS.warn) if (t.includes(s)) return "warn";
  return "na";
}

function guessStatusColIndex(header){

function cacheKey(projectId, menu){
  return `${projectId || "_"}::${menu}`;
}

async function fetchMenu(menu, projectId){
  const cfg = MENUS[menu];
  try{
    const qs = new URLSearchParams({ sheet: cfg.sheetName });
    if (projectId) qs.set("project", projectId);
    const res = await fetch(`/api/sheet?${qs.toString()}`);
    const data = await res.json().catch(() => null);
    if (res.ok && data && !data.error && data.header && data.header.length){
      return { ...data, offline: false };
    }
    throw new Error((data && data.error) || `HTTP ${res.status}`);
  }catch(err){
    // Belum tersambung ke spreadsheet — tetap tampilkan struktur tabel kosong
    return { header: DEFAULT_HEADERS[menu] || ["No.","Keterangan","Status"], rows: [], offline: true, offlineReason: err.message };
  }
}

async function loadMenu(menu, forceRefresh){
  const key = cacheKey(activeProjectId, menu);
  if (cache[key] && !forceRefresh){
    pickRenderer(menu)(menu, cache[key]);
    return;
  }
  renderLoading();
  refreshBtn.classList.add("spinning");
  try{
    const data = await fetchMenu(menu, activeProjectId);
    cache[key] = data;
    lastSyncEl.textContent = "Sinkron " + new Date().toLocaleTimeString('id-ID');
    if (activeMenu === menu) pickRenderer(menu)(menu, data);
  }catch(err){
    if (activeMenu === menu) renderError(err.message);
  }finally{
    refreshBtn.classList.remove("spinning");
  }
}

/* Parse header seperti ["No.","Judul","CONCEPT DRAWING | 07/10/24","CONCEPT DRAWING | 24/10/24","R1 | 21/12/24"]
   menjadi kolom tetap (No, Judul, dst) + grup kolom tanggal (CONCEPT DRAWING, R1, ...) */
function parseRevisionHeader(header){
  const fixed = [];      // { idx, label }
  const groups = [];     // { label, cols: [{ idx, label }] }
  header.forEach((h, idx) => {
    const parts = String(h).split("|").map(s => s.trim());
    if (parts.length < 2){
      fixed.push({ idx, label: h });
    } else {
      const [groupLabel, subLabel] = parts;
      let g = groups[groups.length - 1];
      if (!g || g.label !== groupLabel){
        g = { label: groupLabel, cols: [] };
        groups.push(g);
      }
      g.cols.push({ idx, label: subLabel });
    }
  });
  return { fixed, groups };
}

   disiplin (STR/ARS/MEP) dan status Submit / Disetujui / Reject / Outstanding.
   Status diambil dari kolom "Status Update - Status" (isi: A/B/C/D). */
function computeMaterialSummary(rows){
  const disciplines = ["STR", "ARS", "MEP"];
  const idx = { STR: 3, ARS: 4, MEP: 5 };
  const STATUS_COL = 17; // Status Update - Status
  const summary = {
    STR: { submit: 0, approved: 0, reject: 0, outstanding: 0 },
    ARS: { submit: 0, approved: 0, reject: 0, outstanding: 0 },
    MEP: { submit: 0, approved: 0, reject: 0, outstanding: 0 },
  };
  rows.forEach(row => {
    if (isMaterialGroupRow(row)) return;
    disciplines.forEach(d => {
      if (!String(row[idx[d]] ?? "").trim()) return;
      summary[d].submit++;
      const status = String(row[STATUS_COL] ?? "").trim().toUpperCase();
      if (status === "A" || status === "B") summary[d].approved++;
      else if (status === "C") summary[d].reject++;
      else summary[d].outstanding++;
    });
  });
  return summary;
}

/* ---- Monitoring RFI / PI ---- */

let rfiCutoff = (() => {
  const d = new Date();
  d.setDate(d.getDate() - 7);
  return d.toISOString().slice(0, 10);
})();

function parseRfiDate(v){
  const s = String(v ?? "").trim();
  if (!s) return null;
  let d = new Date(s);
  if (!isNaN(d)) return d;
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m){
    let [, dd, mm, yy] = m;
    if (yy.length === 2) yy = "20" + yy;
    d = new Date(`${yy}-${mm.padStart(2, "0")}-${dd.padStart(2, "0")}`);
    if (!isNaN(d)) return d;
  }
  return null;
}

/* Hitung ringkasan Tabel A dari data Tabel B: jumlah Submit / Replied /
   Closed / Outstanding per disiplin (STR/ARS/MEP), dipecah "s/d Minggu
   Lalu" (tanggal Send Date <= cutoff) dan "Minggu Ini" (sisanya). */
function computeRfiSummary(rows, cutoffStr){
  const disciplines = ["STR", "ARS", "MEP"];
  const idx = { STR: 3, ARS: 4, MEP: 5 };
  const cutoff = cutoffStr ? new Date(cutoffStr) : null;
  const summary = {};
  disciplines.forEach(d => { summary[d] = { submitLW: 0, submitTot: 0, repliedLW: 0, repliedTot: 0, closedLW: 0, closedTot: 0 }; });

  rows.forEach(row => {
    disciplines.forEach(d => {
      if (!String(row[idx[d]] ?? "").trim()) return;
      const s = summary[d];
      s.submitTot++;
      const sendDate = parseRfiDate(row[6]);
      if (cutoff && sendDate && sendDate <= cutoff) s.submitLW++;

      if (String(row[7] ?? "").trim()){
        s.repliedTot++;
        const repliedDate = parseRfiDate(row[7]);
        if (cutoff && repliedDate && repliedDate <= cutoff) s.repliedLW++;
      }
      if (String(row[8] ?? "").trim()){
        s.closedTot++;
        const closedDate = parseRfiDate(row[8]);
        if (cutoff && closedDate && closedDate <= cutoff) s.closedLW++;
      }
    });
  });

  disciplines.forEach(d => {
    const s = summary[d];
    s.submitThis = s.submitTot - s.submitLW;
    s.repliedThis = s.repliedTot - s.repliedLW;
    s.closedThis = s.closedTot - s.closedLW;
    s.outstandingLW = s.submitLW - s.closedLW;
    s.outstandingTot = s.submitTot - s.closedTot;
    s.outstandingThis = s.outstandingTot - s.outstandingLW;
  });
  return summary;
}

/* Hitung ringkasan Tabel A dari data Tabel B: jumlah item Kode 1A / Kode 1B
   per disiplin (STR/ARS/MEP), dipecah "s/d Minggu Lalu" (Tgl Terbit <= cutoff)
   dan "Minggu Ini" (sisanya). VO mengikuti jumlah Kode 1A (1A = SI Kerja
   Tambah/Kurang, Ada VO — lihat Keterangan). Kumulatif = total berjalan
   (1A + 1B) sampai dengan baris tersebut. */
function computeSiSummary(rows, cutoffStr){
  const disciplines = ["STR", "ARS", "MEP"];
  const idxDisc = { STR: 5, ARS: 6, MEP: 7 };
  const idxKode1A = 3, idxKode1B = 4, idxTgl = 1;
  const cutoff = cutoffStr ? new Date(cutoffStr) : null;

  const kode = { kode1A: {}, kode1B: {} };
  disciplines.forEach(d => { kode.kode1A[d] = { lw: 0, tot: 0 }; kode.kode1B[d] = { lw: 0, tot: 0 }; });

  rows.forEach(row => {
    const tglDate = parseRfiDate(row[idxTgl]);
    const isLW = !!(cutoff && tglDate && tglDate <= cutoff);
    const has1A = !!String(row[idxKode1A] ?? "").trim();
    const has1B = !!String(row[idxKode1B] ?? "").trim();
    disciplines.forEach(d => {
      if (!String(row[idxDisc[d]] ?? "").trim()) return;
      if (has1A){ kode.kode1A[d].tot++; if (isLW) kode.kode1A[d].lw++; }
      if (has1B){ kode.kode1B[d].tot++; if (isLW) kode.kode1B[d].lw++; }
    });
  });

  disciplines.forEach(d => {
    kode.kode1A[d].this = kode.kode1A[d].tot - kode.kode1A[d].lw;
    kode.kode1B[d].this = kode.kode1B[d].tot - kode.kode1B[d].lw;
  });

  const totalOf = (k, key) => disciplines.reduce((s, d) => s + kode[k][d][key], 0);
  const total1ALW = totalOf("kode1A", "lw"), total1ATot = totalOf("kode1A", "tot"), total1AThis = total1ATot - total1ALW;
  const total1BLW = totalOf("kode1B", "lw"), total1BTot = totalOf("kode1B", "tot"), total1BThis = total1BTot - total1BLW;
  const voLW = total1ALW, voThis = total1AThis, voTot = total1ATot;
  const kumulatifLW = total1ALW + total1BLW;
  const kumulatifThis = kumulatifLW + total1AThis + total1BThis;

  return { kode, total1ALW, total1AThis, total1BLW, total1BThis, voLW, voThis, voTot, kumulatifLW, kumulatifThis };
}

/* ============================================================
   SUMMARY MONITORING ENGINEERING
   Menggabungkan data dari sheet Shop Drawing, Material Approval,
   Method of Work dan RFI menjadi satu ringkasan bergaya rekap
   mingguan (tabel per disiplin/kategori + chart).
   ============================================================ */

const SMY_STATUS_COLORS = { a: "#3fae6a", b: "#8bc34a", c: "#e2593a", resubmit: "#e2a233" };

function pct(n, total){
  return total ? Math.round((n / total) * 100) : 0;
}

/* Hitung breakdown per "kategori" (mis. disiplin MECHANICAL, ELECTRICAL, dst)
   untuk sheet yang menandai kategori lewat baris judul (group row), seperti
   Shop Drawing dan Material Approval. */
function computeGroupedBreakdown(rows, opts){
  const { isGroupRow, groupName, submittedTest, statusCol } = opts;
  const categories = [];
  const data = {};
  let current = null;
  rows.forEach(row => {
    if (isGroupRow(row)){
      current = groupName(row) || "Lainnya";
      if (!data[current]){ data[current] = { planned: 0, submitted: 0, a: 0, b: 0, c: 0, resubmit: 0 }; categories.push(current); }
      return;
    }
    if (!current || !data[current]) return;
    const d = data[current];
    d.planned++;
    if (submittedTest(row)) d.submitted++;
    const status = String(row[statusCol] ?? "").trim().toUpperCase();
    if (status === "A") d.a++;
    else if (status === "B") d.b++;
    else if (status === "C") d.c++;
    else d.resubmit++;
  });
  categories.forEach(c => { data[c].notSubmitted = data[c].planned - data[c].submitted; });
  return { categories, data };
}

/* Method of Work tidak punya baris judul kategori — disiplinnya ada di
   kolom STR/ARS/MEP per baris, dengan status A/B/C/D sebagai flag kolom
   terpisah (idx 24-27), sama seperti computeMowSummary. */
function computeMowBreakdown(rows){
  const categories = ["STR", "ARS", "MEP"];
  const idx = { STR: 2, ARS: 3, MEP: 4 };
  const data = {};
  categories.forEach(c => { data[c] = { planned: 0, submitted: 0, a: 0, b: 0, c: 0, resubmit: 0 }; });
  rows.forEach(row => {
    if (isMowHighlightRow(row)) return;
    categories.forEach(cat => {
      if (!String(row[idx[cat]] ?? "").trim()) return;
      const d = data[cat];
      d.planned++; d.submitted++;
      if (String(row[24] ?? "").trim()) d.a++;
      else if (String(row[25] ?? "").trim()) d.b++;
      else if (String(row[26] ?? "").trim()) d.c++;
      else d.resubmit++;
    });
  });
  categories.forEach(c => { data[c].notSubmitted = data[c].planned - data[c].submitted; });
  return { categories, data };
}

function totalsOfBreakdown(categories, data){
  const t = { planned: 0, submitted: 0, a: 0, b: 0, c: 0, resubmit: 0 };
  categories.forEach(cat => { const d = data[cat]; Object.keys(t).forEach(k => { t[k] += d[k]; }); });
  t.notSubmitted = t.planned - t.submitted;
  return t;
}

function categoryTableHtml(categories, data, totals, rowsCfg){
  if (!categories.length){
    return `<div style="padding:20px;color:#8992a3;font-size:12.5px;">Belum ada data.</div>`;
  }
  const catHead = categories.map(c => `<th colspan="2">${escapeHtml(c)}</th>`).join("") + `<th colspan="2">TOTAL</th>`;
  const subHead = categories.map(() => `<th>Qty</th><th>%</th>`).join("") + `<th>Qty</th><th>%</th>`;
  const body = rowsCfg.map(r => {
    const cells = categories.map(c => {
      const d = data[c];
      const val = d[r.key];
      const showPct = r.pct && val;
      return `<td>${val || ""}</td><td class="pct-cell">${showPct ? pct(val, d.planned) + "%" : ""}</td>`;
    }).join("");
    const totVal = totals[r.key];
    const totShowPct = r.pct && totVal;
    return `<tr class="${r.cls || ""}"><td class="label">${escapeHtml(r.label)}</td>${cells}<td><b>${totVal || ""}</b></td><td class="pct-cell"><b>${totShowPct ? pct(totVal, totals.planned) + "%" : ""}</b></td></tr>`;
  }).join("");
  return `
    <table class="smy-table">
      <thead>
        <tr><th rowspan="2">Status</th>${catHead}</tr>
        <tr>${subHead}</tr>
      </thead>
      <tbody>${body}</tbody>
    </table>`;
}

/* --- Chart helpers (SVG murni, tanpa library eksternal) --- */
function svgBarChart(categories, values, opts){
  opts = opts || {};
  const w = 380, barH = 20, gap = 12, leftPad = 108, rightPad = 42, topPad = 8;
  const plotW = w - leftPad - rightPad;
  const h = topPad * 2 + categories.length * (barH + gap) - gap;
  const color = opts.color || "#1e2f4f";
  const bars = categories.map((c, i) => {
    const y = topPad + i * (barH + gap);
    const val = Math.max(0, Math.min(100, values[i] || 0));
    const bw = plotW * (val / 100);
    return `
      <text x="${leftPad - 8}" y="${y + barH / 2 + 4}" text-anchor="end" font-size="10.5" fill="#2a3040" font-family="Inter,sans-serif">${escapeHtml(c)}</text>
      <rect x="${leftPad}" y="${y}" width="${plotW}" height="${barH}" rx="4" fill="#eef0f4"/>
      <rect x="${leftPad}" y="${y}" width="${bw}" height="${barH}" rx="4" fill="${color}"/>
      <text x="${leftPad + plotW + 6}" y="${y + barH / 2 + 4}" font-size="10.5" font-weight="700" fill="#101a2e" font-family="Inter,sans-serif">${val}%</text>
    `;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block;">${bars}</svg>`;
}

function svgDonut(segments, opts){
  opts = opts || {};
  const size = opts.size || 148, stroke = 20;
  const r = size / 2 - stroke / 2 - 2, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0);
  let offset = 0;
  const arcs = total === 0
    ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef0f4" stroke-width="${stroke}"/>`
    : segments.filter(s => s.value > 0).map(seg => {
        const frac = seg.value / total;
        const dash = frac * circumference;
        const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
        offset += dash;
        return circle;
      }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${arcs}
    <text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="20" font-weight="800" fill="#101a2e" font-family="Inter,sans-serif">${total}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="9.5" fill="#8992a3" font-family="'IBM Plex Mono',monospace">ITEM</text>
  </svg>`;
}

function chartLegendHtml(segments){
  return `<div class="chart-legend">${segments.map(s => `<span><i style="background:${s.color}"></i>${escapeHtml(s.label)} (${s.value})</span>`).join("")}</div>`;
}

/* Hitung metrik Shop Dwg / Material Approval / Method of Work / RFI untuk
   satu proyek tertentu. Dipakai baik oleh Summary per-proyek maupun oleh
   Summary All Project (daftar semua proyek). */
async function computeProjectMetrics(projectId){
  const need = ["shop-drawing", "material-approval", "method-of-work", "rfi"];
  const results = await Promise.allSettled(need.map(m => {
    const key = cacheKey(projectId, m);
    return cache[key] ? Promise.resolve(cache[key]) : fetchMenu(m, projectId).then(d => { cache[key] = d; return d; });
  }));
  const [sdRes, maRes, mowRes, rfiRes] = results;
  const rowsOf = r => (r.status === "fulfilled" ? (r.value.rows || []) : []);

  const sdB = computeGroupedBreakdown(rowsOf(sdRes), {
    isGroupRow: isDocGroupRow, groupName: r => String(r[1] ?? "").trim(),
    submittedTest: r => !!String(r[9] ?? "").trim(), statusCol: 19,
  });
  const maB = computeGroupedBreakdown(rowsOf(maRes), {
    isGroupRow: isMaterialGroupRow, groupName: r => String(r[2] ?? "").trim(),
    submittedTest: r => !!String(r[7] ?? "").trim(), statusCol: 17,
  });
  const mowB = computeMowBreakdown(rowsOf(mowRes));
  const rfiSummary = computeRfiSummary(rowsOf(rfiRes), null);
  const rfiSubmit = ["STR", "ARS", "MEP"].reduce((s, d) => s + rfiSummary[d].submitTot, 0);
  const rfiReplied = ["STR", "ARS", "MEP"].reduce((s, d) => s + rfiSummary[d].repliedTot, 0);
  const rfiNotReplied = rfiSubmit - rfiReplied;

  const sdTotals = totalsOfBreakdown(sdB.categories, sdB.data);
  const maTotals = totalsOfBreakdown(maB.categories, maB.data);
  const mowTotals = totalsOfBreakdown(mowB.categories, mowB.data);

  return { sdB, maB, mowB, sdTotals, maTotals, mowTotals, rfiSubmit, rfiReplied, rfiNotReplied };
}

/* Summary All Project: daftar semua proyek + persentase submission tiap
   kategori (Shop Dwg, Material Approval, Method of Work, RFI). Klik nama

async function renderAllProjectsSummary(){
  contentEl.innerHTML = `<div class="state-box"><div class="spinner"></div>Memuat ringkasan semua proyek…</div>`;
  const projects = allProjects();

  const metrics = await Promise.all(projects.map(p => computeProjectMetrics(p.id)));

  const items = projects.map((p, i) => {
    const m = metrics[i];
    const sdPct = pct(m.sdTotals.submitted, m.sdTotals.planned);
    const maPct = pct(m.maTotals.submitted, m.maTotals.planned);
    const mowPct = pct(m.mowTotals.submitted, m.mowTotals.planned);
    const rfiPct = pct(m.rfiReplied, m.rfiSubmit);
    return { project: p, sdPct, maPct, mowPct, rfiPct };
  });

  const now = new Date();
  const updatedStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID');

  const badgesHtml = it => `
    <div class="allproj-badges">
      <div class="allproj-badge"><span class="pct-num">${it.sdPct}%</span><span class="pct-lbl">Shop Dwg</span></div>
      <div class="allproj-badge"><span class="pct-num">${it.maPct}%</span><span class="pct-lbl">Mat. Approval</span></div>
      <div class="allproj-badge"><span class="pct-num">${it.mowPct}%</span><span class="pct-lbl">Method of Work</span></div>
      <div class="allproj-badge"><span class="pct-num">${it.rfiPct}%</span><span class="pct-lbl">RFI Replied</span></div>
    </div>`;

  const bodyHtml = it => {
    const categories = ["Shop Dwg", "Material Approval", "Method of Work", "RFI Replied"];
    const values = [it.sdPct, it.maPct, it.mowPct, it.rfiPct];
    return `
      <div class="allproj-body-inner">
        <div class="chart-card-title" style="margin-bottom:14px;">Submission % per Kategori — ${escapeHtml(it.project.title)}</div>
        ${svgBarChart(categories, values)}
      </div>`;
  };

  contentEl.innerHTML = `
    <div class="smy-page-head">
      <div class="smy-page-title">SUMMARY ALL PROJECT</div>
      <div class="smy-page-updated">UPDATED: ${escapeHtml(updatedStr)}</div>
    </div>
    <div class="allproj-list">
      ${items.map(it => `
        <div class="allproj-item" data-allproj="${escapeHtml(it.project.id)}">
          <div class="allproj-head">
            <div class="allproj-head-left">
              <span class="allproj-chevron">&#9656;</span>
              <span class="allproj-name">${escapeHtml(it.project.title)}</span>
            </div>
            ${badgesHtml(it)}
          </div>
          <div class="allproj-body">${bodyHtml(it)}</div>
        </div>`).join("")}
    </div>
  `;

  contentEl.querySelectorAll(".allproj-head").forEach(head => {
    head.addEventListener("click", () => {
      const item = head.closest(".allproj-item");
      const wasOpen = item.classList.contains("open");
      contentEl.querySelectorAll(".allproj-item.open").forEach(el => { if (el !== item) el.classList.remove("open"); });
      item.classList.toggle("open", !wasOpen);
    });
  });
}

function escapeHtml(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function offlineBannerHtml(){
  return `<div class="offline-banner">
    <span>⚠</span>
    <span>Belum tersambung ke spreadsheet — struktur tabel ditampilkan dulu. Kamu tetap bisa menambah data lewat tombol di atas; data akan tersimpan begitu SPREADSHEET_ID di backend sudah diisi.</span>
  </div>`;
}

const modalRoot = document.getElementById("modalRoot");

function openAddModal(menu, header){
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-head">
          <div class="modal-title">Tambah Data — ${escapeHtml(MENUS[menu].title)}</div>
          <button class="modal-close" id="modalCloseBtn">✕</button>
        </div>
        <div class="modal-body" id="modalFields">
          ${header.map((h, i) => `
            <div class="field">
              <label for="f${i}">${escapeHtml(h)}</label>
              <input type="text" id="f${i}" data-idx="${i}">
            </div>
          `).join("")}
        </div>
        <div class="modal-error" id="modalError" style="display:none;"></div>
        <div class="modal-foot">
          <button class="btn-secondary" id="modalCancelBtn">Batal</button>
          <button class="btn-primary" id="modalSaveBtn">Simpan Data</button>
        </div>
      </div>
    </div>
  `;
  const overlay = document.getElementById("modalOverlay");
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  document.getElementById("modalSaveBtn").addEventListener("click", () => submitAddModal(menu, header));
}

function closeModal(){
  modalRoot.innerHTML = "";
}

async function submitAddModal(menu, header){
  const values = header.map((_, i) => document.getElementById(`f${i}`).value);
  const saveBtn = document.getElementById("modalSaveBtn");
  const errEl = document.getElementById("modalError");
  errEl.style.display = "none";
  saveBtn.disabled = true;
  saveBtn.textContent = "Menyimpan…";
  try{
    const res = await fetch("/api/sheet", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sheetName: MENUS[menu].sheetName, values, project: activeProjectId }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || data.error){
      throw new Error((data && data.error) || `HTTP ${res.status}`);
    }
    closeModal();
    await loadMenu(menu, true); // muat ulang dari spreadsheet supaya konsisten
  }catch(err){
    errEl.textContent = "Gagal menyimpan: " + err.message + ". Data belum tersimpan ke spreadsheet — cek konfigurasi backend.";
    errEl.style.display = "block";
    saveBtn.disabled = false;
    saveBtn.textContent = "Simpan Data";
  }
}

// init
goHome();
</script>
</body>
</html>
